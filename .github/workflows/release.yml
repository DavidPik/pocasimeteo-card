name: Build & Release PočasíMeteo Card

on:
  workflow_dispatch:
    inputs:
      oznaceni_verze:
        description: "Označení verze (např. 6.0.56)"
        required: true
      release_notes:
        description: "Release notes"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate release version and sync manifests
        id: version
        env:
          VERSION: ${{ inputs.oznaceni_verze }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "master" ]]; then
            echo "::error::Run the release workflow from master."
            exit 1
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use the numeric MAJOR.MINOR.PATCH format."
            exit 1
          fi

          npm version "${VERSION}" --no-git-tag-version --allow-same-version

          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
            if (pkg.version !== process.env.VERSION || lock.version !== pkg.version || lock.packages[""].version !== pkg.version) {
              throw new Error("Version synchronization failed across package manifests");
            }
          '

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=Počasí Meteo Card – ${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci

      - name: Build and verify bundle
        run: |
          set -euo pipefail
          npm run build
          test -s dist/pocasimeteo-card.js

          node --input-type=module -e '
            import { readFileSync, statSync, writeFileSync } from "node:fs";
            const bundlePath = "dist/pocasimeteo-card.js";
            if (statSync(bundlePath).size < 100_000) {
              throw new Error("Rollup output is unexpectedly small; expected a bundled frontend asset");
            }

            const hacsPath = "hacs.json";
            const hacs = JSON.parse(readFileSync(hacsPath, "utf8"));
            hacs.filename = bundlePath;
            writeFileSync(hacsPath, JSON.stringify(hacs, null, 2) + "\n");
          '

      - name: Commit release manifests and bundle
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json hacs.json dist/pocasimeteo-card.js

          if git diff --cached --quiet; then
            echo "Release files already match the requested version and bundle."
          else
            git commit -m "Prepare release ${RELEASE_TAG}"
            git push origin HEAD:master
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: master
          name: ${{ steps.version.outputs.name }}
          body: ${{ inputs.release_notes }}
          files: dist/pocasimeteo-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
