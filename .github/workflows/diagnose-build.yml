name: Diagnose and Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  diagnose-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check) - do not fail workflow
        id: nodecheck
        continue-on-error: true
        run: |
          echo "=== node --check src/pocasimeteo-card.js ==="
          node --check src/pocasimeteo-card.js || echo "node --check exited with non-zero status"

      - name: Diagnose braces balance and show context
        if: always()
        run: |
          echo "=== Braces diagnostic (Python) ==="
          python3 - <<'PY'
p='src/pocasimeteo-card.js'
s=open(p,'r',encoding='utf-8').read()
open_count=0
line=1
first_negative=None
first_zero_line=None
for i,ch in enumerate(s):
    if ch=='\n': line+=1
    if ch=='{': open_count+=1
    if ch=='}': open_count-=1
    if open_count<0 and first_negative is None:
        first_negative=line
    if open_count==0 and first_zero_line is None:
        first_zero_line=line
print("First line where open_count became negative (too many }) :", first_negative)
print("First line where open_count returned to 0 :", first_zero_line)
print("Final open_count (positive => missing }, negative => extra }):", open_count)
ctx_line = first_zero_line or 758
start = max(1, ctx_line - 12)
end = ctx_line + 12
print(f"\nContext lines {start}..{end}:\n")
with open(p,'r',encoding='utf-8') as f:
    for n,l in enumerate(f, start=1):
        if n>=start and n<=end:
            prefix = ">>" if n==ctx_line else "  "
            print(f"{prefix} {n:4}: {l.rstrip()}")
PY

      - name: Show file slice 740..780 for quick inspection
        if: always()
        run: |
          echo "=== File slice 740..780 ==="
          sed -n '740,780p' src/pocasimeteo-card.js || true

      - name: Run build (Rollup) - show logs even if it fails
        if: always()
        continue-on-error: true
        run: |
          echo "=== npm run build ==="
          npm run build || echo "npm run build exited with non-zero status"
