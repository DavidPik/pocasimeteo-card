name: CI - syntax check & build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check)
        run: node --check src/pocasimeteo-card.js

      - name: Run diagnostic Python script (braces balance)
        run: |
          python3 - <<'PY'
          s=open('src/pocasimeteo-card.js','r',encoding='utf-8').read()
          open_count=0
          line=1
          for i,ch in enumerate(s):
              if ch=='\n': line+=1
              if ch=='{': open_count+=1
              if ch=='}': open_count-=1
              if open_count<0:
                  print("Too many closing } at line", line)
                  break
          else:
              print("Final open_count:", open_count)
          PY

      - name: Run build
        run: npm run build
